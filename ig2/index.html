<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>통합과학2 수업 자료</title>
    <meta name="theme-color" content="#141f29" />
    <style>
      :root { --bg: #f3f6f4; --card: #ffffff; --ink: #1d2a24; --dim: #5d6b64; --accent: #2e7a5a; --line: #dfe6e2; --warn: #b4542c; --soft: #e7f1ec; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #141f29; --card: #1d2a35; --ink: #eef3f1; --dim: #a9b8b2; --accent: #5cd19e; --line: #2c3b47; --warn: #f0a07a; --soft: #22362f; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink);
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
      main { max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
      .crumb { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
      .crumb a { color: var(--accent); text-decoration: none; }
      h1 { margin: 0 0 6px; font-size: 26px; }
      .lead { margin: 0 0 24px; color: var(--dim); line-height: 1.6; }
      .gate { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; max-width: 460px; }
      .gate label { display: block; font-weight: 700; margin-bottom: 8px; }
      .row { display: flex; gap: 8px; }
      .gate input[type=password] { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 10px;
        border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
      button { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      .remember { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; color: var(--dim); }
      .msg { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--warn); }
      .note { margin-top: 14px; font-size: 12px; color: var(--dim); line-height: 1.6; }
      .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
      .ed { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); }
      .bar .lock { background: transparent; color: var(--dim); border: 1px solid var(--line); padding: 5px 12px; font-size: 13px; }
      .big { margin: 0 0 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
      .big > h2 { margin: 0; padding: 14px 18px; font-size: 18px; background: var(--soft); }
      .big > h2 span { color: var(--accent); margin-right: 8px; }
      .mid { padding: 6px 18px 12px; border-top: 1px solid var(--line); }
      .big > h2 + .mid { border-top: 0; }
      .mid h3 { margin: 10px 0 6px; font-size: 15px; color: var(--dim); }
      .mid ol { list-style: none; margin: 0; padding: 0; }
      .mid li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); font-size: 15px; }
      .mid li:first-child { border-top: 0; }
      .num { font-variant-numeric: tabular-nums; color: var(--dim); width: 2.2em; flex: none; }
      .mid li a { color: var(--ink); font-weight: 700; text-decoration: none; }
      .mid li a:hover { color: var(--accent); }
      .go { margin-left: auto; font-size: 13px; color: var(--accent); font-weight: 700; white-space: nowrap; }
      .soon { margin-left: auto; font-size: 12px; color: var(--dim); white-space: nowrap; }
      .mid li.off { color: var(--dim); }
      footer { margin-top: 36px; font-size: 12px; color: var(--dim); line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <div class="crumb"><a href="../">ESC쌤의 수업 앱</a> › 교과목 수업 자료</div>
      <h1>통합과학2 수업 자료</h1>
      <p class="lead">고등학교 1학년 통합과학2 수업 슬라이드입니다. 교과서·지도서·부교재 원본이 들어 있어 접속 코드가 있는 사람만 볼 수 있습니다.</p>

      <form class="gate" id="gate" hidden>
        <label for="code">접속 코드</label>
        <div class="row">
          <input type="password" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" required />
          <button id="enter">입장</button>
        </div>
        <label class="remember"><input type="checkbox" id="remember" /> 이 기기에서 코드 기억하기(개인 기기만)</label>
        <p class="msg" id="msg" role="status"></p>
        <p class="note">교사용 코드와 학생용 코드가 다릅니다. 코드는 담당 선생님께 받으세요.</p>
      </form>

      <section id="toc" hidden>
        <div class="bar"><span class="ed" id="ed"></span><button class="lock" id="lock" type="button">잠그기</button></div>
        <div id="units"></div>
      </section>

      <footer>
        수업 자료와 원본(교과서·지도서·부교재)은 수업용으로만 쓰고 다른 곳에 옮기거나 배포하지 마세요.<br />
        © 2026 ESC쌤(양지고)
      </footer>
    </main>
    <script src="gate.js"></script>
    <script>
      // 2022 개정 통합과학2(비상교육) 교과서 차례. id가 keys.json의 lessons에 있으면 자료가 올라와 있는 것이다.
      const UNITS = [
        { n: "Ⅰ", t: "변화와 다양성", mids: [
          { n: "1", t: "지구 환경 변화와 생물다양성", subs: [["I-1-01", "지구 환경 변화"], ["I-1-02", "진화와 생물다양성"]] },
          { n: "2", t: "화학 변화", subs: [["I-2-01", "산화와 환원"], ["I-2-02", "산과 염기"], ["I-2-03", "물질 변화에서 에너지의 출입"]] } ] },
        { n: "Ⅱ", t: "환경과 에너지", mids: [
          { n: "1", t: "생태계와 환경 변화", subs: [["II-1-01", "생물과 환경"], ["II-1-02", "생태계평형"], ["II-1-03", "지구 환경 변화와 인간 생활"]] },
          { n: "2", t: "에너지 전환과 활용", subs: [["II-2-01", "태양 에너지의 생성과 전환"], ["II-2-02", "발전과 에너지원"], ["II-2-03", "에너지 효율과 신재생 에너지"]] } ] },
        { n: "Ⅲ", t: "과학과 미래 사회", mids: [
          { n: "1", t: "과학 기술의 활용", subs: [["III-1-01", "과학의 유용성과 필요성"], ["III-1-02", "과학 기술 사회에서 빅데이터 활용"]] },
          { n: "2", t: "과학 기술의 발전과 쟁점", subs: [["III-2-01", "과학 기술과 미래 사회"], ["III-2-02", "과학 관련 사회적 쟁점과 과학 윤리"]] } ] },
      ];
      const $ = (s) => document.querySelector(s);
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

      function renderToc(v, ready) {
        $("#ed").textContent = v.ed === "teacher" ? "교사용 · 발표 노트·지도서·정답 표시본 포함" : "학생용";
        const box = $("#units"); box.textContent = "";
        for (const u of UNITS) {
          const big = el("section", "big"), h = el("h2");
          h.append(el("span", "", u.n + "."), u.t); big.append(h);
          for (const m of u.mids) {
            const mid = el("div", "mid"), ol = el("ol");
            mid.append(el("h3", "", m.n + ". " + m.t));
            m.subs.forEach(([id, t], i) => {
              const li = el("li"); li.append(el("span", "num", "0" + (i + 1)));
              if (ready.includes(id)) {
                const a = el("a", "", t); a.href = "view.html?l=" + id;
                const go = el("a", "go", "열기 →"); go.href = a.href;
                li.append(a, go);
              } else { li.className = "off"; li.append(el("span", "", t), el("span", "soon", "준비 중")); }
              ol.append(li);
            });
            mid.append(ol); big.append(mid);
          }
          box.append(big);
        }
        $("#gate").hidden = true; $("#toc").hidden = false;
      }

      async function show() {
        const v = savedKey();
        if (!v) { $("#toc").hidden = true; $("#gate").hidden = false; $("#code").focus(); return; }
        let ready = [];
        try { ready = (await (await fresh("keys.json")).json()).lessons; } catch (_) {}
        renderToc(v, ready);
      }

      $("#gate").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = $("#enter"); btn.disabled = true; $("#msg").textContent = "확인하는 중…";
        try {
          const v = await unlock($("#code").value);
          if (!v) { $("#msg").textContent = "코드가 맞지 않습니다."; return; }
          saveKey(v, $("#remember").checked); $("#code").value = ""; $("#msg").textContent = "";
          const next = new URLSearchParams(location.search).get("next");
          if (next && /^[IV]+-\d-\d\d$/.test(next)) location.href = "view.html?l=" + next; else show();
        } catch (err) {
          $("#msg").textContent = "확인하지 못했습니다. 최신 브라우저(크롬·사파리·엣지)로 열어 주세요.";
        } finally { btn.disabled = false; }
      });
      $("#lock").addEventListener("click", () => { forgetKey(); show(); });
      show();
    </script>
  </body>
</html>
