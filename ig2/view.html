<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>통합과학2 수업 자료</title>
    <style>
      :root { --bg: #f3f6f4; --ink: #1d2a24; --dim: #5d6b64; --accent: #2e7a5a; --line: #dfe6e2; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141f29; --ink: #eef3f1; --dim: #a9b8b2; --accent: #5cd19e; --line: #2c3b47; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
      .box { width: min(360px, calc(100% - 32px)); text-align: center; }
      .track { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 14px 0 8px; }
      .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
      p { margin: 0; font-size: 14px; color: var(--dim); }
      a { color: var(--accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="box">
      <strong id="title">수업 자료를 여는 중</strong>
      <div class="track"><div class="fill" id="fill"></div></div>
      <p id="msg">받는 중…</p>
    </div>
    <script src="gate.js"></script>
    <script>
      (async () => {
        const id = new URLSearchParams(location.search).get("l") || "";
        const msg = document.getElementById("msg"), fill = document.getElementById("fill");
        if (!/^[IV]+-\d-\d\d$/.test(id)) { msg.innerHTML = '잘못된 주소입니다. <a href="./">목차로</a>'; return; }
        const v = savedKey();
        if (!v) { location.replace("./?next=" + id); return; }
        try {
          const html = await loadLesson(v, id, (got, total) => {
            const mb = (got / 1048576).toFixed(1);
            if (total) { fill.style.width = (got / total * 100).toFixed(0) + "%"; msg.textContent = `받는 중… ${mb} / ${(total / 1048576).toFixed(1)}MB`; }
            else msg.textContent = `받는 중… ${mb}MB`;
          });
          msg.textContent = "여는 중…";
          // 풀린 수업 자료로 이 페이지를 바꾼다(주소는 그대로라 판서 자동 저장·슬라이드 번호가 유지된다)
          document.open(); document.write(html); document.close();
        } catch (e) {
          // 열쇠가 바뀌었거나(자료를 다시 올림) 코드가 바뀐 경우: 다시 입장
          if (e && e.name === "OperationError") { forgetKey(); location.replace("./?next=" + id); return; }
          msg.innerHTML = '열지 못했습니다: ' + (e && e.message || e) + ' <a href="./">목차로</a>';
        }
      })();
    </script>
  </body>
</html>
