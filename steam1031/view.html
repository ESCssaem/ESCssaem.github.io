<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>학교 에너지자립 STEAM 발표</title>
    <style>
      :root { --bg: #f4f5f8; --ink: #1d2230; --dim: #5b6475; --accent: #3b5bdb; --line: #dde1e8; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141821; --ink: #eef1f6; --dim: #a7b0c0; --accent: #8ea6ff; --line: #2e3545; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
      .box { width: min(360px, calc(100% - 32px)); text-align: center; }
      .track { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 14px 0 8px; }
      .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
      p { margin: 0; font-size: 14px; color: var(--dim); }
      a { color: var(--accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="box">
      <strong>발표 자료를 여는 중</strong>
      <div class="track"><div class="fill" id="fill"></div></div>
      <p id="msg">받는 중…</p>
    </div>
    <script src="gate.js"></script>
    <script>
      (async () => {
        const msg = document.getElementById("msg"), fill = document.getElementById("fill");
        const v = savedKey();
        if (!v) { location.replace("./?next=view"); return; }
        try {
          const buf = await loadItem(v, "deck", (got, total) => {
            const mb = (got / 1048576).toFixed(1);
            if (total) { fill.style.width = (got / total * 100).toFixed(0) + "%"; msg.textContent = `받는 중… ${mb} / ${(total / 1048576).toFixed(1)}MB`; }
            else msg.textContent = `받는 중… ${mb}MB`;
          });
          msg.textContent = "여는 중…";
          // 풀린 발표 자료로 이 페이지를 바꾼다(주소는 그대로라 판서 자동 저장·슬라이드 번호가 유지된다)
          const html = new TextDecoder().decode(buf);
          document.open(); document.write(html); document.close();
        } catch (e) {
          if (e && e.name === "OperationError") { forgetKey(); location.replace("./?next=view"); return; }
          msg.innerHTML = '열지 못했습니다: ' + (e && e.message || e) + ' <a href="./">처음으로</a>';
        }
      })();
    </script>
  </body>
</html>
