<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>학교 에너지자립 STEAM 발표 · PDF</title>
    <style>
      :root { --bg: #f4f5f8; --card: #ffffff; --ink: #1d2230; --dim: #5b6475; --accent: #3b5bdb; --line: #dde1e8; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141821; --card: #1d2230; --ink: #eef1f6; --dim: #a7b0c0; --accent: #8ea6ff; --line: #2e3545; } }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
      header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
      header a.back { color: var(--accent); text-decoration: none; font-size: 14px; }
      header b { font-size: 15px; }
      header .dl { margin-left: auto; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; }
      header .dl[hidden] { display: none; }
      .wait { flex: 1; display: grid; place-items: center; }
      .box { width: min(360px, calc(100% - 32px)); text-align: center; }
      .track { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 14px 0 8px; }
      .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
      p { margin: 0; font-size: 14px; color: var(--dim); }
      iframe { flex: 1; width: 100%; border: 0; background: #525659; }
    </style>
  </head>
  <body>
    <header><a class="back" href="./">← 목록</a><b id="name"></b><a class="dl" id="dl" hidden>내려받기</a></header>
    <div class="wait" id="wait"><div class="box"><div class="track"><div class="fill" id="fill"></div></div><p id="msg">받는 중…</p></div></div>
    <script src="gate.js"></script>
    <script>
      const FILES = { "slides-pdf": "발표자료.pdf", "script-pdf": "5분_발표원고.pdf" };
      (async () => {
        const f = new URLSearchParams(location.search).get("f");
        const msg = document.getElementById("msg"), fill = document.getElementById("fill");
        if (!FILES[f]) { msg.innerHTML = '잘못된 주소입니다. <a href="./">목록으로</a>'; return; }
        document.getElementById("name").textContent = FILES[f];
        const v = savedKey();
        if (!v) { location.replace("./?next=" + f); return; }
        try {
          const buf = await loadItem(v, f, (got, total) => {
            if (total) fill.style.width = (got / total * 100).toFixed(0) + "%";
            msg.textContent = `받는 중… ${(got / 1048576).toFixed(1)}MB`;
          });
          const url = URL.createObjectURL(new Blob([buf], { type: "application/pdf" }));
          const dl = document.getElementById("dl"); dl.href = url; dl.download = FILES[f]; dl.hidden = false;
          const fr = document.createElement("iframe"); fr.src = url; fr.title = FILES[f];
          document.getElementById("wait").replaceWith(fr);
        } catch (e) {
          if (e && e.name === "OperationError") { forgetKey(); location.replace("./?next=" + f); return; }
          msg.innerHTML = '열지 못했습니다: ' + (e && e.message || e) + ' <a href="./">목록으로</a>';
        }
      })();
    </script>
  </body>
</html>
