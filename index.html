<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESC쌤의 XR 수업 앱</title>
    <meta name="description" content="PC와 Meta Quest(VR)에서 같은 주소로 쓰는 웹 XR 수업 앱 모음" />
    <meta name="theme-color" content="#141f29" />
    <style>
      :root { --bg: #f3f6f4; --card: #ffffff; --ink: #1d2a24; --dim: #5d6b64; --accent: #2e7a5a; --line: #dfe6e2; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #141f29; --card: #1d2a35; --ink: #eef3f1; --dim: #a9b8b2; --accent: #5cd19e; --line: #2c3b47; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink);
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
      main { max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
      h1 { margin: 0 0 6px; font-size: 26px; }
      .lead { margin: 0 0 28px; color: var(--dim); line-height: 1.6; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
      .card { display: flex; gap: 14px; padding: 16px; border-radius: 14px; background: var(--card);
        border: 1px solid var(--line); color: inherit; }
      .card:hover { border-color: var(--accent); }
      .card h2 a { color: inherit; text-decoration: none; }
      .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; margin-bottom: 4px;
        border: 1px solid var(--accent); color: var(--accent); }
      .links { margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
      .links a { color: var(--accent); font-weight: 700; }
      .card img { width: 64px; height: 64px; border-radius: 14px; flex: none; }
      .card h2 { margin: 0 0 4px; font-size: 17px; }
      .card p { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.5; }
      .tag { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--accent); }
      footer { margin-top: 40px; font-size: 12px; color: var(--dim); line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>ESC쌤의 XR 수업 앱</h1>
      <p class="lead"><b>웹 체험</b>은 PC·휴대폰 브라우저에서는 화면으로, Meta Quest 브라우저에서는 VR로 같은 주소를 열어 바로 씁니다(설치·로그인 없음).
        수업 전체를 하고 싶다면 <b>Quest 앱</b> 전체판을 신청해 헤드셋에 설치해 쓰세요(교사 확인 후 제공). 어느 쪽도 이용 기록을 수집하지 않습니다.</p>
      <div class="grid" id="apps"><p class="lead">앱 목록을 불러오는 중…</p></div>
      <footer>
        앱은 학교 수업·연수·비영리 교육에 자유롭게 활용할 수 있습니다. 앱이나 그 일부를 복제·수정해 다른 곳에 배포하는 것은 허락하지 않습니다.<br />
        © 2026 ESC쌤(양지고)
      </footer>
    </main>
    <script>
      const grid = document.getElementById('apps');
      fetch('apps.json')
        .then((r) => r.json())
        .then((slugs) => Promise.all(slugs.map((s) => fetch(`${s}/app.json`).then((r) => r.json()).then((a) => ({ s, a })))))
        .then((apps) => {
          grid.textContent = '';
          for (const { s, a } of apps) {
            const card = document.createElement('div');
            card.className = 'card';
            const img = document.createElement('img');
            img.src = `${s}/${a.icon || 'icons/icon-192.png'}`;
            img.alt = '';
            const body = document.createElement('div');
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = a.kind === 'apk' ? 'Quest 앱 · 교사 신청' : '웹 체험 · 설치 없음';
            const h = document.createElement('h2');
            const title = document.createElement('a');
            title.href = `${s}/`;
            title.textContent = a.title;
            h.append(title);
            const p = document.createElement('p');
            p.textContent = `${a.audience} · ${a.topic}`;
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = a.devices.join(' · ') + (a.minutes ? ` · 약 ${a.minutes}분` : '');
            const links = document.createElement('div');
            links.className = 'links';
            const open = document.createElement('a');
            open.href = `${s}/`;
            open.textContent = a.kind === 'apk' ? '신청·설치 안내 →' : '바로 체험하기 →';
            links.append(open);
            if (a.fullVersion) {
              const full = document.createElement('a');
              full.href = a.fullVersion.page;
              full.textContent = `${a.fullVersion.label} →`;
              links.append(full);
            }
            body.append(badge, h, p, tag, links);
            card.append(img, body);
            grid.append(card);
          }
          if (!apps.length) grid.innerHTML = '<p class="lead">곧 앱이 올라옵니다.</p>';
        })
        .catch(() => (grid.innerHTML = '<p class="lead">앱 목록을 불러오지 못했습니다.</p>'));
    </script>
  </body>
</html>
